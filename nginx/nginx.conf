server {
    listen 80;

    location / {
        root /usr/share/nginx/html;  # ← aqui é o volume do frontend
        index index.html;
        
        try_files $uri $uri/ /index.html;  # garante que o React Router funcione
    }

    location /api {
        proxy_pass http://back:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
